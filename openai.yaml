openapi: 3.0.0
info:
  title: Flashcard Study App API
  description: API for managing flashcards, decks, and user authentication.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local development server
tags:
  - name: Users
    description: Operations related to user authentication and registration
  - name: Flashcards
    description: Operations related to managing flashcards
  - name: Decks
    description: Operations related to managing decks

paths:
  /users/register:
    post:
      tags:
        - Users
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
                - username
                - email
                - password
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Email already exists
        '500':
          description: Internal server error
  /users/login:
    post:
      tags:
        - Users
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          description: Invalid email or password
        '500':
          description: Internal server error
  /flashcards:
    get:
      tags:
        - Flashcards
      summary: Get all flashcards for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of flashcards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flashcard'
        '500':
          description: Internal server error
    post:
      tags:
        - Flashcards
      summary: Add a new flashcard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                deck_id:
                  type: integer
              required:
                - title
                - content
      responses:
        '201':
          description: Flashcard added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          description: Title and content are required
        '500':
          description: Internal server error
  /flashcards/deck/{deck_id}:
    get:
      tags:
        - Flashcards
      summary: Get flashcards by deck ID
      security:
        - bearerAuth: []
      parameters:
        - name: deck_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of flashcards in the specified deck
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flashcard'
        '500':
          description: Internal server error
  /flashcards/{id}:
    put:
      tags:
        - Flashcards
      summary: Update a flashcard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
              required:
                - title
                - content
      responses:
        '200':
          description: Flashcard updated successfully
        '400':
          description: Title and content are required
        '500':
          description: Internal server error
    delete:
      tags:
        - Flashcards
      summary: Delete a flashcard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Flashcard deleted successfully
        '500':
          description: Internal server error
  /decks:
    get:
      tags:
        - Decks
      summary: Get all decks for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of decks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deck'
        '500':
          description: Internal server error
    post:
      tags:
        - Decks
      summary: Add a new deck
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        '201':
          description: Deck added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          description: Deck name is required
        '500':
          description: Internal server error

components:
  schemas:
    Flashcard:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        deck_id:
          type: integer
        user_id:
          type: integer
      required:
        - id
        - title
        - content
        - user_id
    Deck:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        user_id:
          type: integer
      required:
        - id
        - name
        - user_id
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT